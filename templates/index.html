<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Match & Stats Explorer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin-top: 60px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #16a34a;
        }

        /* Result Card */
        .result-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: left;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .team-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .team-info h2 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        .team-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .team-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            margin-top: 15px;
        }

        .error-msg {
            background-color: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>⚽ Football Explorer</h1>
        <p class="subtitle">Search any club to see team info and recent match results</p>

        <div class="search-box">
            <input type="text" id="teamInput" placeholder="e.g. Real Madrid, Arsenal, Liverpool...">
            <button id="searchBtn">Search</button>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <!-- Team Result Card -->
        <div id="resultCard" class="result-card">
            <div class="team-header">
                <!-- <img> tag ဖြင့် Logo တိုက်ရိုက်ဖော်ပြမည့်နေရာ -->
                <img id="teamBadge" src="" alt="Team Logo" class="team-logo">
                <div class="team-info">
                    <h2 id="teamName"></h2>
                    <p id="teamDetails"></p>
                </div>
            </div>
            <p id="teamDesc" class="team-desc"></p>
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const teamInput = document.getElementById('teamInput');
        const resultCard = document.getElementById('resultCard');
        const errorMsg = document.getElementById('errorMsg');

        const teamNameEl = document.getElementById('teamName');
        const teamBadgeEl = document.getElementById('teamBadge');
        const teamDetailsEl = document.getElementById('teamDetails');
        const teamDescEl = document.getElementById('teamDesc');

        async function searchTeam() {
            const query = teamInput.value.trim();
            if (!query) return;

            // Clear previous results & errors
            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';

            try {
                const response = await fetch(`/api/team?name=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (!response.ok) {
                    errorMsg.textContent = data.error || 'အချက်အလက် ရှာမတွေ့ပါ';
                    errorMsg.style.display = 'block';
                    return;
                }

                // Populate data to HTML elements
                teamNameEl.textContent = data.name;
                teamBadgeEl.src = data.badge;
                teamDetailsEl.textContent = `${data.league} • Stadium: ${data.stadium} (Est. ${data.founded})`;
                teamDescEl.textContent = data.description;

                resultCard.style.display = 'block';

            } catch (err) {
                errorMsg.textContent = 'Server သို့မဟုတ် Network ချိတ်ဆက်ရာတွင် အမှားအယွင်းရှိနေပါသည်';
                errorMsg.style.display = 'block';
            }
        }

        searchBtn.addEventListener('click', searchTeam);
        teamInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchTeam();
        });
    </script>

</body>

</html>
